<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>深圳湾雪夜</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

    <main id="canvas-wrap" aria-label="深圳湾建筑剪影，雪花飘落、窗灯亮起，流星划过夜空">

        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M11 5 6 9H3v6h3l5 4Z" />
          <path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
          <path class="sound-off" d="m16 9 5 6m0-6-5 6" />
        </svg>
      </button>
    </main>
    <script src="./canvas-runtime.js"></script>
    <script src="./assets/p5-noise.js"></script>
    <script src="./assets/jrpg-track.js"></script>
    <script src="./sound.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
